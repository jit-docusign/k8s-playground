apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: microservices
  labels:
    app: postgres
type: Opaque
stringData:
  # PostgreSQL credentials (will be base64 encoded automatically)
  POSTGRES_USER: productuser
  POSTGRES_PASSWORD: productpass123
  POSTGRES_DB: productdb
  # Connection string for ProductApi
  DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=productdb;Username=productuser;Password=productpass123"
