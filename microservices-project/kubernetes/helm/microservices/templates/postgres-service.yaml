apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - name: postgres
    port: {{ .Values.postgres.service.port }}
    targetPort: 5432
    protocol: TCP
