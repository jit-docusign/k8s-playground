apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.productApi.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.productApi.name }}
spec:
  replicas: {{ .Values.productApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.productApi.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.productApi.name }}
    spec:
      containers:
      - name: {{ .Values.productApi.name }}
        image: "{{ .Values.productApi.image.repository }}:{{ .Values.productApi.image.tag }}"
        imagePullPolicy: {{ .Values.productApi.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.productApi.service.targetPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.productApi.name }}-config
        env:
        # Database credentials from Secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        # API Key for authentication
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-auth-secret
              key: API_KEY
        resources:
          requests:
            memory: {{ .Values.productApi.resources.requests.memory }}
            cpu: {{ .Values.productApi.resources.requests.cpu }}
          limits:
            memory: {{ .Values.productApi.resources.limits.memory }}
            cpu: {{ .Values.productApi.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.productApi.livenessProbe.httpGet.path }}
            port: {{ .Values.productApi.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.productApi.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.productApi.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.productApi.readinessProbe.httpGet.path }}
            port: {{ .Values.productApi.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.productApi.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.productApi.readinessProbe.periodSeconds }}
