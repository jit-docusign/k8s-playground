apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.orderApi.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.orderApi.name }}
spec:
  type: {{ .Values.orderApi.service.type }}
  selector:
    app: {{ .Values.orderApi.name }}
  ports:
  - port: {{ .Values.orderApi.service.port }}
    targetPort: {{ .Values.orderApi.service.targetPort }}
    protocol: TCP
