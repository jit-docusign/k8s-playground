version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=productuser
      - POSTGRES_PASSWORD=productpass123
      - POSTGRES_DB=productdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  product-api:
    build:
      context: .
      dockerfile: ProductApi/Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=productdb
      - DB_USER=productuser
      - DB_PASSWORD=productpass123
      - API_KEY=product-api-secret-key-12345
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/products/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - microservices-network

  order-api:
    build:
      context: .
      dockerfile: OrderApi/Dockerfile
    container_name: order-api
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - PRODUCT_API_URL=http://product-api:8080
      - PRODUCT_API_KEY=product-api-secret-key-12345
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      product-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/orders/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres-data:
